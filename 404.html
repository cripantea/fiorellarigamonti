<style>
  :root { --blu: #176BE0; --testo: #0D141A; --grigio: #5A6470; }

  .logo { width: min(420px, 80vw); aspect-ratio: 768 / 102; object-fit: cover; object-position: 50% 55%; margin-bottom: 40px; }

  p { font-size: 18px; color: var(--grigio); margin: 0 0 32px; max-width: 520px; line-height: 1.4; }

  a.btn { display: inline-block; padding: 14px 28px; border-radius: 28px; background: var(--blu); color: #fff;
          text-decoration: none; font-size: 17px; border: 1px solid var(--blu); }
  a.btn.secondario { background: #fff; color: var(--blu); }
  a.btn:hover { opacity: .9; }
